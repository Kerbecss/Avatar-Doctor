name: Build VPM Verification Listing

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected published package version
        required: true
        default: "0.0.6"
        type: string

permissions:
  contents: read

jobs:
  build-listing:
    name: build-listing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Show Python version
        run: python3 --version
      - name: Validate repository
        run: python3 ci/validate_repository.py --root .
      - name: Test release pipeline
        run: python3 -B -m unittest discover -s ci/tests -p "test_*.py"
      - name: Confirm requested version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          if [ "$EXPECTED_VERSION" != "0.0.6" ]; then
            echo "expected_version must be 0.0.6." >&2
            exit 1
          fi
      - name: Build local verification listing with Python
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 ci/release_pipeline.py build-listing \
            --root . \
            --output "$RUNNER_TEMP/avatar-doctor-listing/local/index.json" \
            --expected-version "$EXPECTED_VERSION" \
            --source-ref "refs/tags/v$EXPECTED_VERSION" \
            --remote
      - name: Verify listing independently against tag and remote ZIP
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 ci/release_pipeline.py verify-listing \
            --listing "$RUNNER_TEMP/avatar-doctor-listing/local/index.json" \
            --expected-version "$EXPECTED_VERSION" \
            --root . \
            --source-ref "refs/tags/v$EXPECTED_VERSION" \
            --remote
          {
            echo "## Verified local VPM listing"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Version: $EXPECTED_VERSION"
            echo "- Remote ZIP verification: passed"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified local listing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avatar-doctor-v0.0.6-local-vpm-listing
          path: ${{ runner.temp }}/avatar-doctor-listing/local/index.json
          if-no-files-found: error
          retention-days: 7
