name: Build Release Artifacts

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected package version
        required: true
        default: "0.0.6"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Show Python version
        run: python3 --version
      - name: Validate repository
        run: python3 ci/validate_repository.py --root .
      - name: Test release pipeline
        run: python3 -B -m unittest discover -s ci/tests -p "test_*.py"
      - name: Confirm requested version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          if [ "$EXPECTED_VERSION" != "0.0.6" ]; then
            echo "expected_version must be 0.0.6." >&2
            exit 1
          fi
      - name: Build and verify reproducible artifacts
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/avatar-doctor-release"
          build_a="$artifact_root/build-a"
          build_b="$artifact_root/build-b"
          python3 ci/release_pipeline.py build --root . --output-dir "$build_a" --expected-version "$EXPECTED_VERSION"
          python3 ci/release_pipeline.py build --root . --output-dir "$build_b" --expected-version "$EXPECTED_VERSION"
          cmp "$build_a/com.teyocesu.avatar-doctor-$EXPECTED_VERSION.zip" "$build_b/com.teyocesu.avatar-doctor-$EXPECTED_VERSION.zip"
          cmp "$build_a/package.json" "$build_b/package.json"
          cmp "$build_a/SHA256SUMS.txt" "$build_b/SHA256SUMS.txt"
          python3 ci/release_pipeline.py verify --root . --artifacts-dir "$build_a" --expected-version "$EXPECTED_VERSION"
          python3 ci/release_pipeline.py verify --root . --artifacts-dir "$build_b" --expected-version "$EXPECTED_VERSION"
          {
            echo "## Verified release artifacts"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Version: $EXPECTED_VERSION"
            echo "- Reproducibility: passed"
            echo
            echo '```text'
            cat "$build_a/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: avatar-doctor-v0.0.6-release
          path: |
            ${{ runner.temp }}/avatar-doctor-release/build-a/com.teyocesu.avatar-doctor-0.0.6.zip
            ${{ runner.temp }}/avatar-doctor-release/build-a/package.json
            ${{ runner.temp }}/avatar-doctor-release/build-a/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
